name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Every release from v0.1.11 to v0.3.0 shipped with an empty GitHub Release
      # body, because nothing passed the notes on — so everything written for them
      # lived only in the git tag object, where nobody reads it.
      - name: Collect the release notes
        id: notes
        run: |
          set -euo pipefail

          # Read from the API rather than from the checkout. actions/checkout leaves
          # no usable local tag object for a tag push, and fetching the ref back —
          # which works locally — still did not recover the message in CI for
          # v0.3.1 or v0.3.2. The API is authoritative and does not depend on what
          # checkout chose to bring, so there is nothing left to be wrong about.
          notes=''
          notes_source='the tag message'

          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" 2>/dev/null || true)"
          tag_type="$(printf '%s' "$ref" | jq -r '.object.type // empty')"
          tag_sha="$(printf '%s' "$ref" | jq -r '.object.sha // empty')"
          echo "tag $GITHUB_REF_NAME -> type=${tag_type:-unknown} sha=${tag_sha:0:12}"

          # Only an annotated tag carries a message of its own. A lightweight one
          # points straight at a commit, whose message is not release notes.
          if [ "$tag_type" = 'tag' ] && [ -n "$tag_sha" ]; then
            notes="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.message' 2>/dev/null || true)"
            notes="$(printf '%s' "$notes" | sed '/^chore: release v/d')"
          fi

          # Still nothing? Degrade to the changelog rather than to an empty body,
          # and say why. A lightweight tag is the mistake that shipped v0.1.11.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning title=No annotated tag message::$GITHUB_REF_NAME carries no message, so the release notes fall back to CHANGELOG.md. Use 'git tag -a' to author them."
            notes="$(awk '/^\[Compare changes\]/{n++} n==1' CHANGELOG.md)"
            notes_source='CHANGELOG.md'
          fi

          {
            echo 'body<<VERY_HAPPY_DOM_NOTES_EOF'
            printf '%s\n' "$notes"
            echo 'VERY_HAPPY_DOM_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

          # Reported so the next release's log says whether notes were found,
          # rather than leaving an empty body to be noticed months later.
          printf 'Release notes: %s characters from %s.\n' "${#notes}" "$notes_source" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          note: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes reaching the release is the one part of this that cannot be
      # tested without cutting a release, so it is checked here instead. An empty
      # body went unnoticed for four releases; this makes the next one fail loudly
      # rather than quietly.
      - name: Verify the release carries its notes
        run: |
          set -euo pipefail

          length="$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body | length')"
          printf 'Release body: %s characters.\n' "$length" >> "$GITHUB_STEP_SUMMARY"

          if [ "$length" -lt 50 ]; then
            echo "::error title=Release notes missing::The release for $GITHUB_REF_NAME has a body of $length characters. The notes were collected but did not reach it."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
